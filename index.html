<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#15171c" />
    <title>HGhub · 黄果短剧</title>
    <script>
      try {
        var saved = localStorage.getItem("hghub_theme_policy") === "system-v1" ? localStorage.getItem("hghub_theme") : "system";
        if (saved === "light" || (saved !== "dark" && !matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("theme-light");
      } catch (e) {}
    </script>
    <style>html,body{background:#15171c}html.theme-light,html.theme-light body{background:#f6f7fa}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
