name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: TypeScript and production frontend
        run: pnpm build
      - name: Rust offline tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Browser behavior tests
        shell: pwsh
        run: ./scripts/test-browser.ps1 -OutputPath artifacts/browser
      - name: Compile Windows app
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-browser-results
          path: artifacts/browser/
          if-no-files-found: ignore
